# Copy this file to /etc/noisemeter/config.yaml (the installer does this).
audio:
  device: null                 # null = first USB/default input device
  microphone_name: ""          # frei vergebener Anzeigename für Webinterface und Berichte
  sample_rate: 48000
  channels: 1
  block_seconds: 0.25
  calibration_offset_db: 94.0 # calibrate with a known 94 dB / 1 kHz source
  pre_roll_seconds: 3
  post_roll_seconds: 5
  mp3_bitrate_kbps: 128        # CBR: 64, 96, 128, 192, 256 oder 320 kbit/s
  calibration_file: null       # im Webinterface hochladen, z. B. UMIK-2 / MM-2USB
  calibration_files: {"0": null, "90": null} # beide SEN-Dateien aus dem ZIP
  calibration_angle: "0"       # Mikrofon zur Schallquelle: 0 oder 90 Grad
  calibration_graphic: null    # Grafik aus dem Kalibrier-ZIP
  manual_calibration_db: 0.0   # zusätzliche manuelle Korrektur in dB
  weighting: A                 # A (dBA) oder C (dBC)
  time_weighting: fast         # fast (125 ms) oder slow (1 s)
storage:
  audio_dir: /var/lib/noisemeter/audio
  retention_days: 360          # Ereignis-MP3s und Einträge werden danach gelöscht
  calibration_dir: /var/lib/noisemeter/calibration
  database: /var/lib/noisemeter/noisemeter.sqlite3
  report_dir: /var/lib/noisemeter/reports
web:
  host: 0.0.0.0
  port: 8080
  secret_key: change-this-secret-key
  refresh_seconds: 5           # Intervall für die Live-Pegel-Aktualisierung
site_name: Strassenseite
mqtt:
  enabled: false
  host: homeassistant.local
  port: 1883
  username: ""
  password: ""
  discovery_prefix: homeassistant
  base_topic: noisemeter
# At least one enabled time window can be active. Windows may cross midnight.
periods:
  - name: Tag
    start: "07:00"
    end: "19:00"
    threshold_db: 65
    warning_db: 75
    severe_db: 80
    enabled: true
  - name: Abend
    start: "19:00"
    end: "22:00"
    threshold_db: 55
    warning_db: 65
    severe_db: 70
    enabled: true
  - name: Nacht
    start: "22:00"
    end: "07:00"
    threshold_db: 45
    warning_db: 55
    severe_db: 60
    enabled: true
